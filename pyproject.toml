[project]
name = "glioma-transportability"
version = "1.0.0"
description = "Transportability of glioma survival prediction models across TCGA and CGGA"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
